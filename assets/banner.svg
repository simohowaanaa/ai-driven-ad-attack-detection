<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #e6edf3; letter-spacing: 1px; }
      .sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #8b949e; letter-spacing: 0.5px; }
      .tag   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .bar   { animation: slide 3s ease-in-out infinite alternate; }
      @keyframes slide { from { opacity: 0.4; } to { opacity: 1; } }
      .dot   { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { r: 4; opacity: 0.6; } 50% { r: 6; opacity: 1; } }
      .scan  { animation: scanner 4s linear infinite; }
      @keyframes scanner { from { transform: translateX(0); } to { transform: translateX(600px); } }
      .fade  { animation: fadein 1.2s ease forwards; }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" fill="url(#bg)" rx="10"/>

  <!-- Left accent bar (animated) -->
  <rect x="0" y="0" width="4" height="120" fill="#1f6feb" rx="2" class="bar"/>

  <!-- Scanning line -->
  <rect x="10" y="0" width="2" height="120" fill="#1f6feb" opacity="0.15" class="scan"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#21262d" stroke-width="1"/>

  <!-- Main title -->
  <text x="32" y="48" class="title fade" style="animation-delay:0.1s">
    Active Directory Attack Detection
  </text>

  <!-- Subtitle -->
  <text x="32" y="70" class="sub fade" style="animation-delay:0.3s">
    Wazuh SIEM · Custom Rules · Isolation Forest AI Agent
  </text>

  <!-- Tags -->
  <rect x="32" y="82" width="78" height="20" rx="4" fill="#1f6feb" opacity="0.2"/>
  <text x="71" y="96" class="tag" fill="#58a6ff" text-anchor="middle" class="fade" style="animation-delay:0.5s">Wazuh</text>

  <rect x="118" y="82" width="110" height="20" rx="4" fill="#388bfd" opacity="0.15"/>
  <text x="173" y="96" class="tag" fill="#79c0ff" text-anchor="middle" class="fade" style="animation-delay:0.6s">Isolation Forest</text>

  <rect x="236" y="82" width="108" height="20" rx="4" fill="#3fb950" opacity="0.15"/>
  <text x="290" y="96" class="tag" fill="#56d364" text-anchor="middle" class="fade" style="animation-delay:0.7s">MITRE ATT&amp;CK</text>

  <rect x="352" y="82" width="86" height="20" rx="4" fill="#f78166" opacity="0.15"/>
  <text x="395" y="96" class="tag" fill="#ffa198" text-anchor="middle" class="fade" style="animation-delay:0.8s">GOAD-Light</text>

  <!-- Animated dots (right side) -->
  <circle cx="760" cy="40" r="4" fill="#1f6feb" class="dot" style="animation-delay:0s"/>
  <circle cx="790" cy="40" r="4" fill="#3fb950" class="dot" style="animation-delay:0.4s"/>
  <circle cx="820" cy="40" r="4" fill="#d29922" class="dot" style="animation-delay:0.8s"/>
  <circle cx="850" cy="40" r="4" fill="#f78166" class="dot" style="animation-delay:1.2s"/>
  <circle cx="880" cy="40" r="4" fill="#bc8cff" class="dot" style="animation-delay:1.6s"/>

  <!-- Score display -->
  <text x="760" y="72" class="sub" text-anchor="middle" style="font-size:10px;fill:#8b949e">2/12</text>
  <text x="790" y="72" class="sub" text-anchor="middle" style="font-size:10px;fill:#8b949e">9/12</text>
  <text x="820" y="72" class="sub" text-anchor="middle" style="font-size:10px;fill:#8b949e">IA</text>
  <text x="760" y="84" class="sub" text-anchor="middle" style="font-size:9px;fill:#484f58">défaut</text>
  <text x="790" y="84" class="sub" text-anchor="middle" style="font-size:9px;fill:#484f58">règles</text>
  <text x="820" y="84" class="sub" text-anchor="middle" style="font-size:9px;fill:#484f58">agent</text>
</svg>
